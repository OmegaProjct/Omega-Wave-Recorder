name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release-Bereinigung & Entwurf erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          echo "Suche nach existierenden Releases für Tag $tag..."
          
          # Bestehende Releases/Drafts für diesen Tag löschen
          release_ids=$(gh api repos/${{ github.repository }}/releases --jq ".[] | select(.tag_name == \"$tag\") | .id")
          for id in $release_ids; do
            echo "Lösche existierendes Release/Draft ID $id..."
            gh api -X DELETE repos/${{ github.repository }}/releases/$id
          done
          
          echo "Erstelle neuen Entwurf (Draft) für $tag..."
          gh api -X POST repos/${{ github.repository }}/releases -f tag_name="$tag" -f name="$tag" -F draft=true

  publish:
    name: Build & Publish Release on ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]

    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Code kompilieren
        run: npm run build

      - name: Anwendung kompilieren & Veröffentlichen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --win --publish always
        shell: bash

  publish-release:
    name: Release veröffentlichen
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Release editieren und veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          title="Omega Wave Recorder v$version"
          echo "Extracting release notes from CHANGELOG.md..."
          node scripts/extract-changelog.js "$version" changelog_notes.md
          echo "Publishing release $tag with title '$title'..."
          gh release edit "$tag" --draft=false --title "$title" --notes-file changelog_notes.md --latest
